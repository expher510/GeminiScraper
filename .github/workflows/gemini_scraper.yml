name: Gemini Web Scraper & Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt text for Gemini (e.g. Generate image of a cat / answer question)'
        required: true
        type: string
      image_url:
        description: 'Optional image/video URL to attach to the prompt'
        required: false
        type: string
      media_b64:
        description: 'Optional Base64 encoded video or image content'
        required: false
        type: string
      media_ext:
        description: 'File extension for media_b64 (e.g. .mp4, .png, .jpg)'
        required: false
        type: string
        default: '.mp4'
      cookies_b64:
        description: 'Cookies file content (Base64 encoded JSON)'
        required: true
        type: string
      n8n_webhook:
        description: 'n8n webhook URL for result callback'
        required: false
        type: string
        default: 'https://n8n-p4oh.srv1867849.hstgr.cloud/webhook/gemini'

jobs:
  scrape-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Decode and Save Cookies
        run: |
          echo "${{ github.event.inputs.cookies_b64 }}" | base64 --decode > cookies.json

      - name: Run Gemini Scraper
        id: scraper
        run: |
          MEDIA_ARG=""
          if [ -n "${{ github.event.inputs.media_b64 }}" ]; then
            MEDIA_ARG="--media-b64 '${{ github.event.inputs.media_b64 }}' --media-ext '${{ github.event.inputs.media_ext }}'"
          elif [ -n "${{ github.event.inputs.image_url }}" ]; then
            MEDIA_ARG="--image-url '${{ github.event.inputs.image_url }}'"
          fi

          python gemini_scraper.py \
            --prompt "${{ github.event.inputs.prompt }}" \
            $MEDIA_ARG \
            --cookies-file cookies.json \
            --output-dir outputs

      - name: Read Scraper Output
        if: always()
        id: parse_output
        run: |
          if [ -f outputs/result.json ]; then
            RESPONSE_TEXT=$(jq -r '.response_text' outputs/result.json | head -n 20)
            echo "response_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$RESPONSE_TEXT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "response_summary=No result generated" >> $GITHUB_OUTPUT
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-output-${{ github.run_id }}
          path: outputs/
          retention-days: 90

      - name: Notify n8n (Success)
        if: success() && inputs.n8n_webhook != ''
        run: |
          python -c "
          import json, os, urllib.request

          webhook_url = '${{ github.event.inputs.n8n_webhook }}'
          result_path = 'outputs/result.json'

          payload = {
              'status': 'success',
              'run_id': '${{ github.run_id }}',
              'repo': '${{ github.repository }}',
              'prompt': '${{ github.event.inputs.prompt }}',
              'artifact_name': 'gemini-output-${{ github.run_id }}'
          }

          if os.path.exists(result_path):
              with open(result_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              payload['response_text'] = data.get('response_text', '')
              payload['generated_files'] = data.get('generated_files', [])
              payload['primary_media_name'] = data.get('primary_media_name')
              payload['primary_media_b64'] = data.get('primary_media_b64')
              payload['primary_media_type'] = data.get('primary_media_type')

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('✅ Notified n8n Webhook with full text response and media payload')
          except Exception as e:
              print(f'⚠️ Webhook notification failed: {e}')
          "

      - name: Notify n8n (Failure)
        if: failure() && inputs.n8n_webhook != ''
        run: |
          curl -s -X POST "${{ github.event.inputs.n8n_webhook }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"error\",
              \"run_id\": \"${{ github.run_id }}\",
              \"repo\": \"${{ github.repository }}\",
              \"message\": \"Gemini scraping task failed.\",
              \"prompt\": \"${{ github.event.inputs.prompt }}\"
            }"
          echo "❌ Notified n8n Webhook on failure"
